user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	charset UTF-8;
	sendfile on;
	tcp_nopush on;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	log_format ta_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time "$http_referer" "$http_user_agent"';
	error_log /var/log/nginx/error.log;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Cloudflare is enabled only for ta.dygdyg.ru. Trusted proxy ranges preserve
	# the real client IP for Cloudflare traffic while direct mirrors keep theirs.
	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;
	real_ip_recursive on;

	# These public routes can trigger expensive server-side database work.
	limit_req_zone $binary_remote_addr zone=ta_search_per_ip:10m rate=1r/s;
	limit_req_zone $binary_remote_addr zone=ta_anime_per_ip:10m rate=3r/s;

	# Do not route unknown hosts to any application.
	server {
		listen 80 default_server;
		server_name _;
		return 444;
	}

	server {
		listen 443 ssl default_server;
		server_name _;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		return 444;
	}

	# Next.js mirrors: ta.dygdyg.ru + track-anime.dygdyg.ru + track-anime.duckdns.org
	server {
		listen 80;
		server_name ta.dygdyg.ru track-anime.dygdyg.ru track-anime.duckdns.org;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name ta.dygdyg.ru track-anime.dygdyg.ru track-anime.duckdns.org;

		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		# Common scanner targets are never application routes; reject them before Next.js.
		location ~* ^/(?:\.env(?:/|$)|\.git(?:/|$)|wp-config(?:\.|$)|phpinfo(?:\.|$)|vendor(?:/|$)|cgi-bin(?:/|$)|config(?:/|$)|aws(?:/|$)) {
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			return 404;
		}

		location = /search {
			limit_req zone=ta_search_per_ip burst=5 nodelay;
			limit_req_status 429;
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}

		location = /api/search {
			limit_req zone=ta_search_per_ip burst=5 nodelay;
			limit_req_status 429;
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}

		location ^~ /anime/ {
			limit_req zone=ta_anime_per_ip burst=12 nodelay;
			limit_req_status 429;
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}

		location / {
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}
	}

	# PHP: server.dygdyg.ru (HTTPS)
	server {
		server_name server.dygdyg.ru dygdyg.duckdns.org;

		client_max_body_size 20G;
		client_body_timeout 300;
		send_timeout 300;

		root /var/www/html;
		index index.php index.html index.htm;

		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
		add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;

		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
		}

		location ~ /\.ht {
			deny all;
		}

		listen 443 ssl;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	server {
		listen 80;
		server_name server.dygdyg.ru dygdyg.duckdns.org;
		return 301 https://$host$request_uri;
	}
}
