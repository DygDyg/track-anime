user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	charset UTF-8;
	sendfile on;
	tcp_nopush on;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	log_format ta_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time "$http_referer" "$http_user_agent"';
	error_log /var/log/nginx/error.log;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Cloudflare is enabled for ta.dygdyg.ru and track-anime.win. Trusted proxy
	# ranges preserve the real client IP for Cloudflare traffic while direct
	# mirrors keep theirs.
	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;
	real_ip_recursive on;

	# Legacy hosts → track-anime.win only for normal browsers.
	# Default is NO redirect — old WebView shells (no custom UA marker) must stay
	# in-app; otherwise shouldOverrideUrlLoading opens Chrome on .win.
	# First matching regex wins; exclusions before ~*Mozilla.
	# Use HTML 200 bounce (not 301): browsers permanently cache 301 Location and
	# would keep landing on .win without ?legacy_redirect=1 after we change it.
	map $http_user_agent $ta_do_win_redirect {
		default 0;
		"~*TrackAnimeAndroid" 0;
		"~*TrackAnimeWindows" 0;
		"~*;\s*wv\)" 0;
		"~*Mozilla" 1;
	}

	# Append ?legacy_redirect=1 so the site can show a deprecation notice.
	map $args $ta_win_redirect_url {
		""	https://track-anime.win$uri?legacy_redirect=1;
		default	https://track-anime.win$uri?$args&legacy_redirect=1;
	}

	# Scrapers that flood /anime/* and starve the Shikimori rate limiter (SSR hang).
	map $http_user_agent $ta_block_scraper {
		default 0;
		"~*(?:GPTBot|ClaudeBot|Anthropic|Bytespider|SemrushBot|AhrefsBot|DataForSeoBot|PetalBot|DotBot|MJ12bot|Amazonbot|CCBot|meta-externalagent|FacebookBot|ImagesiftBot)" 1;
	}

	# These public routes can trigger expensive server-side database work.
	limit_req_zone $binary_remote_addr zone=ta_search_per_ip:10m rate=1r/s;
	limit_req_zone $binary_remote_addr zone=ta_anime_per_ip:10m rate=3r/s;

	# Do not route unknown hosts to any application.
	server {
		listen 80 default_server;
		server_name _;
		return 444;
	}

	server {
		listen 443 ssl default_server;
		server_name _;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		return 444;
	}

	# Next.js mirrors: track-anime.win + track-anime.duckdns.org
	# track-anime.win — свой LE-сертификат; legacy .dygdyg.ru — track-anime-legacy.dygdyg.ru
	# (автопродление legacy отключено — домен до конца месяца; не возвращать в certbot renew).
	# Browsers (Mozilla*, not WebView/native): HTML bounce → .win?legacy_redirect=1.
	# Android WebView / TrackAnime* shells: serve site here (in-app update).
	server {
		listen 80;
		server_name track-anime.dygdyg.ru ta.dygdyg.ru;
		error_page 418 = @ta_legacy_bounce;
		if ($ta_do_win_redirect = 1) {
			return 418;
		}
		return 301 https://$host$request_uri;

		location @ta_legacy_bounce {
			internal;
			default_type "text/html; charset=utf-8";
			add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
			add_header Pragma "no-cache" always;
			return 200 '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=$ta_win_redirect_url"><meta name="robots" content="noindex"><title>Track Anime</title><script>location.replace("$ta_win_redirect_url");</script></head><body style="margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef7;display:flex;min-height:100vh;align-items:center;justify-content:center"><p>Перенаправление на актуальный адрес… <a style="color:#7dd3fc" href="$ta_win_redirect_url">Открыть</a></p></body></html>';
		}
	}

	server {
		listen 443 ssl;
		server_name track-anime.dygdyg.ru ta.dygdyg.ru;
		ssl_certificate /etc/letsencrypt/live/track-anime-legacy.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/track-anime-legacy.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		error_page 418 = @ta_legacy_bounce;
		if ($ta_do_win_redirect = 1) {
			return 418;
		}
		include /etc/nginx/snippets/track-anime-proxy.conf;

		location @ta_legacy_bounce {
			internal;
			default_type "text/html; charset=utf-8";
			add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
			add_header Pragma "no-cache" always;
			return 200 '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=$ta_win_redirect_url"><meta name="robots" content="noindex"><title>Track Anime</title><script>location.replace("$ta_win_redirect_url");</script></head><body style="margin:0;font-family:system-ui,sans-serif;background:#0b0f14;color:#e8eef7;display:flex;min-height:100vh;align-items:center;justify-content:center"><p>Перенаправление на актуальный адрес… <a style="color:#7dd3fc" href="$ta_win_redirect_url">Открыть</a></p></body></html>';
		}
	}

	server {
		listen 80;
		server_name track-anime.win www.track-anime.win mirror.track-anime.win track-anime.duckdns.org;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name track-anime.win www.track-anime.win mirror.track-anime.win;
		ssl_certificate /etc/letsencrypt/live/track-anime.win/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/track-anime.win/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
		include /etc/nginx/snippets/track-anime-proxy.conf;
	}

	server {
		listen 443 ssl;
		server_name track-anime.duckdns.org;

		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
		include /etc/nginx/snippets/track-anime-proxy.conf;
	}

	# PHP: server.dygdyg.ru (HTTPS)
	server {
		server_name server.dygdyg.ru dygdyg.duckdns.org;

		client_max_body_size 20G;
		client_body_timeout 300;
		send_timeout 300;

		root /var/www/html;
		index index.php index.html index.htm;

		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
		add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;

		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
		}

		location ~ /\.ht {
			deny all;
		}

		listen 443 ssl;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	server {
		listen 80;
		server_name server.dygdyg.ru dygdyg.duckdns.org;
		return 301 https://$host$request_uri;
	}
}
