user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	charset UTF-8;
	sendfile on;
	tcp_nopush on;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	log_format ta_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time "$http_referer" "$http_user_agent"';
	error_log /var/log/nginx/error.log;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Next.js: ta.dygdyg.ru
	server {
		listen 80;
		server_name ta.dygdyg.ru;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name ta.dygdyg.ru;

		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		location / {
			access_log /var/log/nginx/ta.dygdyg.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}
	}

	# Next.js: track-anime.dygdyg.ru + track-anime.duckdns.org
	server {
		listen 80;
		server_name track-anime.dygdyg.ru track-anime.duckdns.org;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name track-anime.dygdyg.ru track-anime.duckdns.org;

		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		location / {
			access_log /var/log/nginx/track-anime.timing.log ta_timing;
			proxy_pass http://127.0.0.1:3001;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 120;
			proxy_send_timeout 120;
		}
	}

	# PHP: server.dygdyg.ru (HTTPS)
	server {
		server_name server.dygdyg.ru dygdyg.duckdns.org x.duckdns.org;

		client_max_body_size 20G;
		client_body_timeout 300;
		send_timeout 300;

		root /var/www/html;
		index index.php index.html index.htm;

		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
		add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;

		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			include fastcgi_params;
		}

		location ~ /\.ht {
			deny all;
		}

		listen 443 ssl;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	server {
		if ($host = server.dygdyg.ru) {
			return 301 https://$host$request_uri;
		}

		server_name server.dygdyg.ru dygdyg.duckdns.org x.dygdyg.ru;
		return 404;

		listen 443 ssl;
		ssl_certificate /etc/letsencrypt/live/server.dygdyg.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/server.dygdyg.ru/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	server {
		if ($host = x.dygdyg.ru) {
			return 301 https://$host$request_uri;
		}

		if ($host = dygdyg.duckdns.org) {
			return 301 https://$host$request_uri;
		}

		if ($host = server.dygdyg.ru) {
			return 301 https://$host$request_uri;
		}

		listen 80;
		server_name server.dygdyg.ru dygdyg.duckdns.org x.dygdyg.ru;
		return 404;
	}
}
