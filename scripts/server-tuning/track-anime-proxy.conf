# Shared reverse-proxy locations for Track Anime Next.js (:3001).
# Included from HTTPS server blocks in nginx.conf.

# Common scanner targets are never application routes; reject them before Next.js.
location ~* ^/(?:\.env(?:/|$)|\.git(?:/|$)|wp-config(?:\.|$)|phpinfo(?:\.|$)|vendor(?:/|$)|cgi-bin(?:/|$)|config(?:/|$)|aws(?:/|$)) {
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	return 404;
}

location = /search {
	limit_req zone=ta_search_per_ip burst=5 nodelay;
	limit_req_status 429;
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	proxy_pass http://127.0.0.1:3001;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 120;
	proxy_send_timeout 120;
}

location = /api/search {
	limit_req zone=ta_search_per_ip burst=5 nodelay;
	limit_req_status 429;
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	proxy_pass http://127.0.0.1:3001;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 120;
	proxy_send_timeout 120;
}

location ^~ /anime/ {
	if ($ta_block_scraper = 1) {
		access_log /var/log/nginx/track-anime.timing.log ta_timing;
		return 403;
	}
	limit_req zone=ta_anime_per_ip burst=12 nodelay;
	limit_req_status 429;
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	proxy_pass http://127.0.0.1:3001;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 120;
	proxy_send_timeout 120;
}

# Must match WATCH_PARTY_PORT (prod: 3002). Without this, wss://…/watch-party-ws
# hits Next.js and room create/join hangs.
location /watch-party-ws {
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	proxy_pass http://127.0.0.1:3002;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 86400;
	proxy_send_timeout 86400;
}

location / {
	access_log /var/log/nginx/track-anime.timing.log ta_timing;
	proxy_pass http://127.0.0.1:3001;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_read_timeout 120;
	proxy_send_timeout 120;
}
