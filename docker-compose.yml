services:
  postgres:
    image: postgres:16-alpine
    container_name: track-anime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: track_anime
      POSTGRES_PASSWORD: track_anime
      POSTGRES_DB: track_anime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_anime -d track_anime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
